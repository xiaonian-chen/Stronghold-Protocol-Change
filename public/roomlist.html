<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大厅房间列表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;background:#111916;color:#c3cbc7;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(14,18,17,0.95);border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:#4ed8af;flex-shrink:0}
.logo-text{font-size:16px;font-weight:700;color:#f2f2f2}
.topright{display:flex;align-items:center;gap:12px;font-size:12px;color:#8a948f}
.stat{display:flex;align-items:center;gap:4px}
.stat-num{color:#4ed8af;font-weight:600}
.container{max-width:800px;margin:0 auto;padding:16px 20px}
.card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:8px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);transition:all .15s;cursor:pointer}
.card:hover{background:rgba(78,216,175,0.04);border-color:rgba(78,216,175,0.15)}
.card--match{opacity:0.55}
.card-left{display:flex;flex-direction:column;gap:3px;min-width:0}
.card-code{font-family:"SF Mono","Fira Code","Consolas",monospace;font-size:16px;font-weight:700;color:#4ed8af;letter-spacing:.03em}
.card-host{font-size:12px;color:#8a948f}
.card-mid{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tag{padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag--FUNNY{background:rgba(246,163,41,0.12);color:#f6a329}
.tag--NORMAL{background:rgba(232,90,26,0.12);color:#f29260}
.tag--HARD{background:rgba(231,49,24,0.12);color:#e73118}
.tag--ABYSS{background:rgba(255,0,36,0.12);color:#ff5454}
.tag--mode{background:rgba(159,212,255,0.08);color:#9fd4ff}
.card-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.players{font-size:13px;color:#c3cbc7;font-weight:600;white-space:nowrap}
.badge{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:600}
.badge--wait{background:rgba(78,216,175,0.08);color:#4ed8af}
.badge--match{background:rgba(231,49,24,0.08);color:#e73118}
.btn-join{padding:6px 14px;border:1px solid #2a9e7f;border-radius:6px;background:rgba(42,158,127,0.12);color:#4ed8af;cursor:pointer;font-size:12px;font-weight:600;transition:all .12s}
.btn-join:hover{background:rgba(42,158,127,0.25)}
.btn-join:disabled{opacity:0.35;cursor:default}
.btn-join--watch{border-color:rgba(231,49,24,0.2);color:#e18578;background:rgba(231,49,24,0.08)}
.btn-join--watch:hover{background:rgba(231,49,24,0.16)}
.empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.2);font-size:14px}
.empty-icon{font-size:36px;margin-bottom:12px}
.quick-bar{display:flex;justify-content:center;padding:12px 0}
.btn-quick{padding:8px 20px;border:1px solid rgba(255,198,0,0.25);border-radius:8px;background:rgba(255,198,0,0.08);color:#f2bd3e;cursor:pointer;font-size:13px;font-weight:600}
.btn-quick:hover{background:rgba(255,198,0,0.16)}
.btn-quick:disabled{opacity:0.35;cursor:default}
.footer{text-align:center;padding:12px;font-size:11px;color:#5d6863}
.error-bar{text-align:center;padding:20px;color:#e18578;font-size:13px;display:none}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><span class="logo-dot"></span><span class="logo-text">大厅房间列表</span></div>
  <div class="topright">
    <span class="stat" id="roomcount">加载中...</span>
    <span class="auto-refresh" style="font-size:11px;color:#5d6863">每5秒刷新</span>
  </div>
</div>
<div class="error-bar" id="errbar">无法获取房间列表，请确认服务器已启动并启用了「大厅房间列表核心」插件</div>
<div class="container" id="list">
  <div class="empty"><div class="empty-icon">&#128269;</div>正在加载房间列表...</div>
</div>
<div class="quick-bar">
  <button class="btn-quick" id="quickBtn" disabled>&#9889; 快速匹配</button>
</div>
<div class="footer">将此页加入书签，随时查看房间列表</div>
<script src="/roomlist.js"></script>
</body>
</html>
